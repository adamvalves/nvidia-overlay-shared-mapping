name: Build & Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Solution (x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MSBuild Solution
        run: |
          msbuild nvidia-overlay-shared-mapping.sln /p:Configuration=Release /p:Platform=x64

      - name: Verify Architecture Headers
        run: |
          if (-not (Test-Path "include/nvovr.hpp")) {
              Write-Error "Missing include/nvovr.hpp"
          }
          Write-Host "Build verification completed successfully."
